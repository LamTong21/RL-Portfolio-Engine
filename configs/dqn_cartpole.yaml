# Environment Configuration
env:
  id: "CartPole-v1"
  seed: 42

# Neural Network Architecture
model:
  hidden_dim: 128
  activation: "relu"

# Optimization & Hyperparameters
hyperparameters:
  learning_rate: 0.001
  gamma: 0.99
  batch_size: 64
  buffer_size: 100000
  target_update_freq: 200     # Hard update step interval
  tau: 1.0                    # Set tau < 1.0 for Polyak soft update (e.g., 0.005)

# Exploration Schedule (\epsilon-greedy)
exploration:
  epsilon_start: 1.0
  epsilon_end: 0.02
  epsilon_decay: 0.995

# Training Protocol
training:
  max_episodes: 400
  max_steps_per_episode: 500
  warmup_steps: 1000          # Min transitions in buffer before gradient updates begin
  gradient_clip_norm: 10.0

# Logging & Artifacts
logging:
  log_interval: 20            # Log mean metrics every N episodes
  save_dir: "models/checkpoints/dqn_cartpole"
  plot_path: "docs/images/dqn_cartpole_curve.png"